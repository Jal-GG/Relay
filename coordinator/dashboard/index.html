<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay — Cluster Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --online: #3fb950;
      --offline: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, "Segoe UI Mono", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: 0.5px; }
    h1 .accent { color: var(--accent); }
    .meta { color: var(--muted); font-size: 12px; }
    .meta .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--online);
      margin-right: 6px;
      vertical-align: middle;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      white-space: nowrap;
    }
    th {
      background: #1f262d;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    tr:last-child td { border-bottom: none; }
    .status {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status.online { color: var(--online); background: rgba(63, 185, 80, 0.12); }
    .status.offline { color: var(--offline); background: rgba(248, 81, 73, 0.12); }
    .status.pending { color: var(--muted); background: rgba(139, 148, 158, 0.12); }
    .status.running { color: var(--accent); background: rgba(88, 166, 255, 0.12); }
    .status.completed { color: var(--online); background: rgba(63, 185, 80, 0.12); }
    .status.failed { color: var(--offline); background: rgba(248, 81, 73, 0.12); }
    .status.timed_out { color: var(--offline); background: rgba(248, 81, 73, 0.12); }
    .muted { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 32px; }
    h2 { font-size: 16px; margin: 28px 0 12px; letter-spacing: 0.5px; }
    h2 .accent { color: var(--accent); }
    .summary { display: flex; gap: 16px; margin-bottom: 12px; }
    .summary .pill {
      padding: 4px 12px;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .summary .pill .count { font-weight: 600; color: var(--text); margin-left: 4px; }
    .pipeline-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 8px 0;
    }
    .pipeline-stage {
      flex: 1;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      min-width: 0;
    }
    .pipeline-stage .label { color: var(--accent); font-weight: 600; }
    .pipeline-stage .layers { color: var(--muted); }
    .pipeline-arrow { color: var(--muted); font-size: 16px; }
    .infer-box {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin: 12px 0;
    }
    .infer-box textarea {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
    }
    .infer-box button {
      padding: 10px 20px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .infer-box button:disabled { opacity: 0.5; cursor: wait; }
    .infer-output {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 13px;
      min-height: 40px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .infer-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .infer-error { color: var(--offline); }
  </style>
</head>
<body>
  <header>
    <h1>Relay <span class="accent">Cluster</span></h1>
    <div class="meta"><span class="dot"></span><span id="updated">waiting…</span></div>
  </header>

  <table>
    <thead>
      <tr>
        <th>Hostname</th>
        <th>Status</th>
        <th>IP</th>
        <th>OS</th>
        <th>CPU cores</th>
        <th>CPU %</th>
        <th>RAM free</th>
        <th>GPU</th>
        <th>VRAM free</th>
        <th>Last seen</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="10" class="empty">No workers registered.</td></tr>
    </tbody>
  </table>

  <h2><span class="accent">Tasks</span></h2>
  <div class="summary" id="task-summary"></div>
  <table>
    <thead>
      <tr>
        <th>Task ID</th>
        <th>Type</th>
        <th>Status</th>
        <th>Worker</th>
        <th>Created</th>
        <th>Completed</th>
        <th>Result / Error</th>
      </tr>
    </thead>
    <tbody id="task-rows">
      <tr><td colspan="7" class="empty">No tasks submitted.</td></tr>
    </tbody>
  </table>

  <h2><span class="accent">Pipeline</span></h2>
  <div id="pipeline-view"><span class="muted">No inference workers registered.</span></div>

  <h2><span class="accent">Inference</span></h2>
  <div class="infer-box">
    <textarea id="prompt" placeholder="Enter a prompt…" rows="2">The capital of France is</textarea>
    <button id="generate-btn" onclick="doGenerate()">Generate</button>
  </div>
  <div class="infer-output" id="infer-output"><span class="muted">Output will appear here.</span></div>
  <div class="infer-meta" id="infer-meta"></div>

  <script>
    const REFRESH_MS = 3000;

    function fmtBytes(mb) {
      if (mb == null) return "—";
      if (mb >= 1024) return (mb / 1024).toFixed(1) + " GB";
      return Math.round(mb) + " MB";
    }

    function fmtAgo(iso) {
      const then = new Date(iso).getTime();
      const sec = Math.max(0, Math.floor((Date.now() - then) / 1000));
      if (sec < 1) return "just now";
      if (sec < 60) return sec + "s ago";
      return Math.floor(sec / 60) + "m ago";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function refresh() {
      try {
        const [workersRes, tasksRes, pipelineRes] = await Promise.all([
          fetch("/workers"),
          fetch("/tasks"),
          fetch("/pipeline"),
        ]);
        const workers = await workersRes.json();
        const tasks = await tasksRes.json();
        const pipelineStages = await pipelineRes.json();
        const rows = document.getElementById("rows");
        if (!workers.length) {
          rows.innerHTML = '<tr><td colspan="10" class="empty">No workers registered.</td></tr>';
        } else {
          rows.innerHTML = workers.map(w => {
            const gpu = w.hardware.gpu;
            const gpuName = gpu ? escapeHtml(gpu.name) : '<span class="muted">none</span>';
            const vramFree = gpu ? fmtBytes(gpu.vram_free_mb) : '<span class="muted">—</span>';
            return `
              <tr>
                <td>${escapeHtml(w.hostname)}</td>
                <td><span class="status ${w.status}">${w.status}</span></td>
                <td>${escapeHtml(w.ip)}</td>
                <td>${escapeHtml(w.hardware.os)}</td>
                <td>${w.hardware.cpu_cores}</td>
                <td>${w.hardware.cpu_percent.toFixed(1)}%</td>
                <td>${fmtBytes(w.hardware.ram_free_mb)} / ${fmtBytes(w.hardware.ram_total_mb)}</td>
                <td>${gpuName}</td>
                <td>${vramFree}</td>
                <td>${fmtAgo(w.last_seen)}</td>
              </tr>
            `;
          }).join("");
        }

        renderPipeline(pipelineStages);
        renderTasks(tasks);
        document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("updated").textContent = "update failed: " + err;
      }
    }

    function renderPipeline(stages) {
      const el = document.getElementById("pipeline-view");
      if (!stages || !stages.length) {
        el.innerHTML = '<span class="muted">No inference workers registered.</span>';
        return;
      }
      let html = '<div class="pipeline-bar">';
      stages.forEach((s, i) => {
        if (i > 0) html += '<span class="pipeline-arrow">→</span>';
        html += `
          <div class="pipeline-stage">
            <div class="label">${escapeHtml(s.worker_id)}</div>
            <div class="layers">layers ${s.layer_start}-${s.layer_end - 1}</div>
            <div class="muted">${escapeHtml(s.model_name)}</div>
          </div>
        `;
      });
      html += '</div>';
      el.innerHTML = html;
    }

    async function doGenerate() {
      const btn = document.getElementById("generate-btn");
      const output = document.getElementById("infer-output");
      const meta = document.getElementById("infer-meta");
      const prompt = document.getElementById("prompt").value;
      btn.disabled = true;
      output.innerHTML = '<span class="muted">Generating…</span>';
      meta.innerHTML = "";
      try {
        const resp = await fetch("/generate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({prompt, max_new_tokens: 50, temperature: 0.0}),
        });
        const data = await resp.json();
        if (!resp.ok) {
          output.innerHTML = `<span class="infer-error">Error: ${escapeHtml(data.detail || "unknown")}</span>`;
        } else {
          output.textContent = data.text;
          meta.textContent = `${data.input_tokens} input + ${data.output_tokens} output tokens in ${data.elapsed_ms}ms`;
        }
      } catch (err) {
        output.innerHTML = `<span class="infer-error">Request failed: ${escapeHtml(err)}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderTasks(tasks) {
      const summary = document.getElementById("task-summary");
      const rows = document.getElementById("task-rows");
      if (!tasks.length) {
        summary.innerHTML = "";
        rows.innerHTML = '<tr><td colspan="7" class="empty">No tasks submitted.</td></tr>';
        return;
      }
      const counts = {};
      for (const t of tasks) counts[t.status] = (counts[t.status] || 0) + 1;
      summary.innerHTML = Object.entries(counts).map(([status, n]) =>
        `<span class="pill"><span class="status ${status}">${status}</span><span class="count">${n}</span></span>`
      ).join("");

      const sorted = tasks.slice().sort((a, b) =>
        new Date(b.created_at) - new Date(a.created_at)
      ).slice(0, 50);

      rows.innerHTML = sorted.map(t => {
        const shortId = t.task_id.slice(0, 8);
        const detail = t.error
          ? `<span class="muted">${escapeHtml(t.error)}</span>`
          : t.result
            ? escapeHtml(JSON.stringify(t.result))
            : '<span class="muted">—</span>';
        const worker = t.worker_id
          ? escapeHtml(t.worker_id)
          : '<span class="muted">—</span>';
        const completed = t.completed_at ? fmtAgo(t.completed_at) : '<span class="muted">—</span>';
        return `
          <tr>
            <td title="${escapeHtml(t.task_id)}">${shortId}</td>
            <td>${escapeHtml(t.type)}</td>
            <td><span class="status ${t.status}">${t.status}</span></td>
            <td>${worker}</td>
            <td>${fmtAgo(t.created_at)}</td>
            <td>${completed}</td>
            <td>${detail}</td>
          </tr>
        `;
      }).join("");
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
